{{- if not .Values.admin.existingSecret }}
{{- $name := include "gocloak.adminSecret" . }}
{{- $password := .Values.admin.password }}
{{- if not $password }}
{{- with lookup "v1" "Secret" .Release.Namespace $name }}
{{- $password = index .data "password" | b64dec }}
{{- end }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "gocloak.labels" . | nindent 4 }}
type: Opaque
data:
  username: {{ .Values.admin.username | b64enc | quote }}
  password: {{ default (randAlphaNum 24) $password | b64enc | quote }}
{{- end }}
{{- if and (eq .Values.database.vendor "postgres") (not .Values.database.existingSecret) }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "gocloak.dbSecret" . }}
  labels:
    {{- include "gocloak.labels" . | nindent 4 }}
type: Opaque
data:
  {{ .Values.database.existingSecretPasswordKey }}: {{ .Values.database.password | b64enc | quote }}
{{- end }}
