# Release binaries, archives and multi-arch container images; run by
# .github/workflows/release.yml on a version tag. Check locally with:
#   goreleaser release --snapshot --clean
version: 2
project_name: gocloak

before:
  hooks:
    - go mod download
    # Keycloak's admin console (Apache License 2.0) for the images
    - go run ./cmd/gocloak download-admin-console --dir build/admin-console
    # the data volume, writable by the image's nonroot user
    - mkdir -p build/data

builds:
  - id: gocloak
    main: ./cmd/gocloak
    binary: gocloak
    env:
      - CGO_ENABLED=0
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    flags: [-trimpath]
    ldflags:
      - -s -w -X main.version={{ .Version }}

archives:
  - formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - README.md
      - docs/*.md

checksum:
  name_template: checksums.txt

dockers_v2:
  - images:
      - ghcr.io/ducnt114/gocloak
    tags:
      - "{{ .Version }}"
      - "{{ if not .Prerelease }}latest{{ end }}"
    dockerfile: Dockerfile.release
    platforms: [linux/amd64, linux/arm64]
    extra_files:
      - build/admin-console
      - build/data
    labels:
      org.opencontainers.image.title: gocloak
      org.opencontainers.image.description: Keycloak-compatible identity and access management server written in Go
      org.opencontainers.image.source: https://github.com/ducnt114/gocloak
      org.opencontainers.image.version: "{{ .Version }}"
      org.opencontainers.image.revision: "{{ .FullCommit }}"
      org.opencontainers.image.created: "{{ .Date }}"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"
