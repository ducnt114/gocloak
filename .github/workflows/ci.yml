name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "Files not formatted with gofmt:"; echo "$unformatted"; exit 1
          fi
      - run: go vet ./...

  test-sqlite:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go test -race -count=1 ./...

  test-postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: gocloak
          POSTGRES_PASSWORD: gocloak
          POSTGRES_DB: gocloak
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U gocloak" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      GOCLOAK_TEST_POSTGRES_URL: postgres://gocloak:gocloak@localhost:5432/gocloak?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go test -race -count=1 ./...

  test-openldap:
    runs-on: ubuntu-latest
    env:
      GOCLOAK_TEST_LDAP_URL: ldap://127.0.0.1:3890
      GOCLOAK_TEST_LDAP_PASSWORD: secret
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: start OpenLDAP
        run: |
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends slapd
          sudo systemctl stop slapd || true
          sudo apparmor_parser -R /etc/apparmor.d/usr.sbin.slapd 2>/dev/null || true
          sudo DIR=/var/lib/ldap/gocloak-ci scripts/ci/openldap.sh
      - run: go test -count=1 -run 'TestLDAP' -v ./internal/server

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t gocloak:ci .
      - name: smoke test
        run: |
          docker run -d --name gocloak -p 8080:8080 \
            -e KC_BOOTSTRAP_ADMIN_USERNAME=admin -e KC_BOOTSTRAP_ADMIN_PASSWORD=admin gocloak:ci start-dev
          for i in $(seq 1 30); do curl -sf localhost:8080/health/ready && break; sleep 1; done
          curl -sf -d grant_type=password -d client_id=admin-cli -d username=admin -d password=admin \
            localhost:8080/realms/master/protocol/openid-connect/token > /dev/null
          curl -sf localhost:8080/admin/master/console/ | grep -q '"clientId":"security-admin-console"'
          docker logs gocloak

  saml-interop:
    # A real Keycloak acts as the SAML service provider of a gocloak realm:
    # login, assertion encryption, both bindings and logout.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: start Keycloak
        run: |
          docker run -d --name keycloak --network host \
            -e KC_BOOTSTRAP_ADMIN_USERNAME=admin -e KC_BOOTSTRAP_ADMIN_PASSWORD=admin \
            quay.io/keycloak/keycloak:26.0.7 start-dev --http-port 8180
      - name: start gocloak
        run: |
          go build -o gocloak ./cmd/gocloak
          KC_BOOTSTRAP_ADMIN_USERNAME=admin KC_BOOTSTRAP_ADMIN_PASSWORD=admin \
            ./gocloak start-dev --http-port 8080 --db-url gocloak.db --rate-limit 0 > gocloak.log 2>&1 &
          for i in $(seq 1 60); do curl -sf localhost:8080/health/ready > /dev/null && break; sleep 1; done
          for i in $(seq 1 90); do curl -sf localhost:8180/realms/master > /dev/null && break; sleep 2; done
      - run: python3 scripts/compat/saml_sp.py --keycloak http://localhost:8180 --gocloak http://localhost:8080
      - if: failure()
        run: docker logs keycloak 2>&1 | tail -80; tail -80 gocloak.log

  oidc-conformance:
    # The OpenID Foundation conformance suite: the Config OP, Basic OP and
    # Form Post OP certification plans (scripts/conformance).
    runs-on: ubuntu-latest
    timeout-minutes: 90
    services:
      mongo:
        image: mongo:6.0
        ports: ["27017:27017"]
    env:
      SUITE_VERSION: release-v5.3.1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: actions/cache@v4
        id: suite
        with:
          path: conformance-suite
          key: conformance-suite-${{ env.SUITE_VERSION }}
      - name: build the conformance suite
        if: steps.suite.outputs.cache-hit != 'true'
        run: |
          git clone --depth 1 --branch "$SUITE_VERSION" https://gitlab.com/openid/conformance-suite.git conformance-suite
          cd conformance-suite && mvn -B -q -DskipTests package
      - name: runner dependencies
        run: python3 -m venv "$RUNNER_TEMP/venv" && "$RUNNER_TEMP/venv/bin/pip" install -q httpx pyparsing
      - name: run the certification plans
        run: SUITE_DIR=$PWD/conformance-suite PYTHON=$RUNNER_TEMP/venv/bin/python WORK=$RUNNER_TEMP scripts/conformance/run.sh
      - if: failure()
        run: tail -n 60 "$RUNNER_TEMP/run.log" "$RUNNER_TEMP/gocloak.log" "$RUNNER_TEMP/suite.log"
