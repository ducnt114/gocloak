name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "Files not formatted with gofmt:"; echo "$unformatted"; exit 1
          fi
      - run: go vet ./...

  test-sqlite:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go test -race -count=1 ./...

  test-postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: gocloak
          POSTGRES_PASSWORD: gocloak
          POSTGRES_DB: gocloak
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U gocloak" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      GOCLOAK_TEST_POSTGRES_URL: postgres://gocloak:gocloak@localhost:5432/gocloak?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go test -race -count=1 ./...

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t gocloak:ci .
      - name: smoke test
        run: |
          docker run -d --name gocloak -p 8080:8080 \
            -e KC_BOOTSTRAP_ADMIN_USERNAME=admin -e KC_BOOTSTRAP_ADMIN_PASSWORD=admin gocloak:ci start-dev
          for i in $(seq 1 30); do curl -sf localhost:8080/health/ready && break; sleep 1; done
          curl -sf -d grant_type=password -d client_id=admin-cli -d username=admin -d password=admin \
            localhost:8080/realms/master/protocol/openid-connect/token > /dev/null
          docker logs gocloak
