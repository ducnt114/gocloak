{{template "header" .}}
<form method="post" action="{{.BaseURL}}/">
  <input type="hidden" name="stateChecker" value="{{.StateChecker}}">
  {{range .Profile}}
  <label for="{{.Name}}">{{$.T .Label}}{{if .Required}} *{{end}}</label>
  <input id="{{.Name}}" name="{{.Name}}" type="{{.Type}}" value="{{.Value}}"{{if .ReadOnly}} readonly{{end}}>
  {{if .Error}}<div class="field-error" id="input-error-{{.Name}}">{{$.FieldText .}}</div>{{end}}
  {{end}}
  <button type="submit" id="save-btn">{{.T "doSave"}}</button>
</form>
{{template "footer" .}}
