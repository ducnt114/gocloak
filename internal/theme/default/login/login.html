{{template "header" .}}
<form id="kc-form-login" method="post" action="{{.Action}}">
  <label for="username">{{.T .UsernameLabel}}</label>
  <input id="username" name="username" type="text" value="{{.Username}}" autocomplete="username" autofocus required>
  <label for="password">{{.T "password"}}</label>
  <input id="password" name="password" type="password" autocomplete="current-password" required>
  <div class="row">
    {{if .RememberMe}}<label class="check"><input type="checkbox" id="rememberMe" name="rememberMe"{{if .Remembered}} checked{{end}}> {{.T "rememberMe"}}</label>{{else}}<span></span>{{end}}
    {{if .ResetURL}}<a href="{{.ResetURL}}">{{.T "doForgotPassword"}}</a>{{end}}
  </div>
  <button type="submit" id="kc-login">{{.T "doLogIn"}}</button>
</form>
{{if .RegisterURL}}<p class="center">{{.T "noAccount"}} <a id="kc-register" href="{{.RegisterURL}}">{{.T "doRegister"}}</a></p>{{end}}
{{template "social" .}}
{{template "footer" .}}
