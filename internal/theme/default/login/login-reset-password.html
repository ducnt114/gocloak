{{template "header" .}}
<form id="kc-reset-password-form" method="post" action="{{.Action}}">
  <label for="username">{{.T .UsernameLabel}}</label>
  <input id="username" name="username" type="text" autocomplete="username" autofocus required>
  <button type="submit">{{.T "doSubmit"}}</button>
</form>
{{if .LoginURL}}<p class="center"><a href="{{.LoginURL}}">{{.T "backToLogin"}}</a></p>{{end}}
{{template "footer" .}}
