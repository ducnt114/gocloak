{{template "header" .}}
<p class="center"><strong>{{.Username}}</strong>{{if .RestartURL}} · <a href="{{.RestartURL}}">{{.T "restartLoginTooltip"}}</a>{{end}}</p>
<form id="kc-form-login" method="post" action="{{.Action}}">
  <label for="password">{{.T "password"}}</label>
  <input id="password" name="password" type="password" autocomplete="current-password" autofocus required>
  {{if .ResetURL}}<p><a href="{{.ResetURL}}">{{.T "doForgotPassword"}}</a></p>{{end}}
  <button type="submit" id="kc-login">{{.T "doLogIn"}}</button>
</form>
{{template "footer" .}}
