{{template "header" .}}
<form id="kc-form-login" method="post" action="{{.Action}}">
  <label for="username">{{.UsernameLabel}}</label>
  <input id="username" name="username" type="text" value="{{.Username}}" autocomplete="username" autofocus required>
  {{if .RememberMe}}<label class="check"><input type="checkbox" name="rememberMe"{{if .Remembered}} checked{{end}}> Remember me</label>{{end}}
  <button type="submit" id="kc-login">Sign In</button>
</form>
{{if .RegisterURL}}<p class="center">New user? <a href="{{.RegisterURL}}">Register</a></p>{{end}}
{{template "footer" .}}
