{{template "header" .}}
<p class="center"><strong>{{.Username}}</strong>{{if .RestartURL}} · <a href="{{.RestartURL}}">Restart login</a>{{end}}</p>
<form id="kc-form-login" method="post" action="{{.Action}}">
  <label for="password">Password</label>
  <input id="password" name="password" type="password" autocomplete="current-password" autofocus required>
  {{if .ResetURL}}<p><a href="{{.ResetURL}}">Forgot Password?</a></p>{{end}}
  <button type="submit" id="kc-login">Sign In</button>
</form>
{{template "footer" .}}
