{{template "header" .}}
<form id="kc-otp-login-form" method="post" action="{{.Action}}">
  <label for="otp">One-time code</label>
  <input id="otp" name="otp" type="text" inputmode="numeric" autocomplete="one-time-code" autofocus required>
  <button type="submit" id="kc-login">Sign In</button>
</form>
{{template "footer" .}}
