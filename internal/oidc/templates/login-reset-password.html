{{template "header" .}}
<form id="kc-reset-password-form" method="post" action="{{.Action}}">
  <label for="username">{{.UsernameLabel}}</label>
  <input id="username" name="username" type="text" autocomplete="username" autofocus required>
  <button type="submit">Submit</button>
</form>
{{if .LoginURL}}<p class="center"><a href="{{.LoginURL}}">« Back to Login</a></p>{{end}}
{{template "footer" .}}
