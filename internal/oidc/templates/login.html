{{template "header" .}}
<form id="kc-form-login" method="post" action="{{.Action}}">
  <label for="username">{{.UsernameLabel}}</label>
  <input id="username" name="username" type="text" value="{{.Username}}" autocomplete="username" autofocus required>
  <label for="password">Password</label>
  <input id="password" name="password" type="password" autocomplete="current-password" required>
  <div class="row">
    {{if .RememberMe}}<label class="check"><input type="checkbox" id="rememberMe" name="rememberMe"{{if .Remembered}} checked{{end}}> Remember me</label>{{else}}<span></span>{{end}}
    {{if .ResetURL}}<a href="{{.ResetURL}}">Forgot Password?</a>{{end}}
  </div>
  <button type="submit" id="kc-login">Sign In</button>
</form>
{{if .RegisterURL}}<p class="center">New user? <a id="kc-register" href="{{.RegisterURL}}">Register</a></p>{{end}}
{{template "footer" .}}
